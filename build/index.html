<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>tetris</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #bfd1f2;
	background-color: #0d0519;
	overflow: hidden;
	touch-action: none;
	font-family: monospace;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* ============================================================
   LOADING OVERLAY
   Tetris-themed pixel-art loading screen
   Colors match the in-game visual style:
     BG:      #0d0519 (dark purple)
     Border:  #a6a6b8
     Bar BG:  #171724
     Empty:   #1a1a26
     Text:    #bfd1f2
   ============================================================ */

#status {
	position: absolute;
	left: 0;
	right: 0;
	top: 0;
	bottom: 0;
	background-color: #0d0519;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	transition: opacity 0.25s ease-out;
	image-rendering: pixelated;
}

/* --- Title --- */
#status-title {
	font-size: 54px;
	font-weight: bold;
	letter-spacing: 4px;
	margin-bottom: 24px;
	color: #bfd1f2;
}

/* --- Segmented progress bar --- */
#progress-bar-border {
	display: flex;
	align-items: center;
	border: 2px solid #a6a6b8;
	padding: 3px;
	background-color: #171724;
}

.segment {
	width: 14px;
	height: 14px;
	margin-right: 2px;
	background-color: #1a1a26;
	position: relative;
	image-rendering: pixelated;
}

.segment:last-child {
	margin-right: 0;
}

.segment.filled {
	/* Base color set via inline style */
}

/* Pixel-art highlight: top + left inner bevel */
.segment.filled::before {
	content: '';
	position: absolute;
	top: 0;
	left: 0;
	width: 100%;
	height: 2px;
	background: linear-gradient(
		to bottom,
		rgba(255, 255, 255, 0.25),
		rgba(255, 255, 255, 0.2)
	);
	border-left: 2px solid rgba(255, 255, 255, 0.2);
	box-sizing: border-box;
}

/* Pixel-art shadow: bottom + right inner bevel */
.segment.filled::after {
	content: '';
	position: absolute;
	bottom: 0;
	right: 0;
	width: 100%;
	height: 2px;
	background: linear-gradient(
		to top,
		rgba(0, 0, 0, 0.3),
		rgba(0, 0, 0, 0.25)
	);
	border-right: 2px solid rgba(0, 0, 0, 0.25);
	box-sizing: border-box;
}

.segment.pulsing {
	animation: pulse 0.6s ease-in-out infinite alternate;
}

@keyframes pulse {
	from { opacity: 0.25; }
	to   { opacity: 0.5; }
}

/* --- Loading text --- */
#status-loading-text {
	font-size: 22px;
	margin-top: 16px;
	color: #bfd1f2;
}

/* --- Faint grid background --- */
#status::before {
	content: '';
	position: absolute;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	background-image:
		linear-gradient(to right,  rgba(255, 255, 255, 0.018) 1px, transparent 1px),
		linear-gradient(to bottom, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
	background-size: 32px 32px;
	pointer-events: none;
}

/* --- Error notice --- */
#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: monospace;
	line-height: 1.3;
	margin: 2rem;
	padding: 1rem;
	text-align: center;
	display: none;
	z-index: 1;
}

/* Hide default splash image — we use our own title text */
#status-splash {
	display: none;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<!-- Hidden splash image (Godot requires this element) -->
			<img id="status-splash" src="index.png" alt="">

			<!-- Tetris title -->
			<div id="status-title">TETRIS</div>

			<!-- Segmented pixel-art progress bar -->
			<div id="progress-bar-border">
				<!-- 20 segments, generated by JS -->
			</div>

			<!-- Loading percentage text -->
			<div id="status-loading-text">LOADING...</div>

			<!-- Error notice (hidden by default) -->
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":5350536,"index.wasm":37003942},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = true;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const SEGMENT_COUNT = 20;

	// Tetromino colors (I, J, L, O, S, T, Z) — cycling
	const PIECE_COLORS = [
		'#00F0F0', // I - Cyan
		'#0000FF', // J - Blue
		'#FFA500', // L - Orange
		'#FFFF00', // O - Yellow
		'#00FF00', // S - Green
		'#800080', // T - Purple
		'#FF0000', // Z - Red
	];

	const statusOverlay = document.getElementById('status');
	const statusNotice = document.getElementById('status-notice');
	const progressBar = document.getElementById('progress-bar-border');
	const loadingText = document.getElementById('status-loading-text');

	// Generate segments
	const segments = [];
	for (let i = 0; i < SEGMENT_COUNT; i++) {
		const seg = document.createElement('div');
		seg.className = 'segment';
		progressBar.appendChild(seg);
		segments.push(seg);
	}

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			// Fade out, then remove
			statusOverlay.style.opacity = '0';
			setTimeout(function () {
				statusOverlay.remove();
			}, 250);
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function updateProgress(fraction) {
		const filled = Math.floor(fraction * SEGMENT_COUNT);
		const currentSeg = filled; // the one currently loading

		for (let i = 0; i < SEGMENT_COUNT; i++) {
			const seg = segments[i];
			const color = PIECE_COLORS[i % PIECE_COLORS.length];

			if (i < filled) {
				// Filled segment
				seg.className = 'segment filled';
				seg.style.backgroundColor = color;
			} else if (i === currentSeg && fraction < 1.0) {
				// Pulsing current segment
				seg.className = 'segment pulsing';
				seg.style.backgroundColor = color;
			} else {
				// Empty segment
				seg.className = 'segment';
				seg.style.backgroundColor = '';
			}
		}

		const pct = Math.floor(fraction * 100);
		loadingText.textContent = 'LOADING... ' + pct + '%';
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach(function (line) {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					updateProgress(current / total);
				}
			},
		}).then(function () {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
